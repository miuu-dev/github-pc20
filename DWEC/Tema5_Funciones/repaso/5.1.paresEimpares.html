<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Función de pares e impares</title>
    <link rel="icon" href="../../img/miuuLogo.png">
    <style>
        @font-face {
            font-family: 'CenturyGothic';
            src: url('../../fonts/CenturyGothic.otf');
        }

        * {
            font-family: 'CenturyGothic', sans-serif;
        }
    </style>
</head>
<body>
    <script>
        let numeros = []

        for(let i = 0; i < 500; i++) {
            numeros.push(parseInt(Math.random()*10000))
        } // añadimos al array vacío números randoms que sean hasta 99

        function parImpar(n) {
            return (n % 2 == 0) ? "Par":"Impar"
        } // comprobamos si es par o impar

        let resultado = numeros.map(parImpar) // creamos un nuevo array con los resultados de la función anterior

        for (let i = 0; i < numeros.length; i++) {
            document.write(`El número <b>${numeros[i]}</b> es <b>${resultado[i]}</b> <br>`)
        } // mostramos por documento el número y si es par o impar
        
    </script>
</body>
</html>
