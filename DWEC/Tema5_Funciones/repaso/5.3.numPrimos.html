<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Números primos</title>
    <link rel="icon" href="../../img/miuuLogo.png">
    <style>
        @font-face {
            font-family: 'CenturyGothic';
            src: url('../../fonts/CenturyGothic.otf');
        }

        * {
            font-family: 'CenturyGothic', sans-serif;
        }
    </style>
</head>

<body>
    <script>
        let num = parseInt(prompt("Indique un número entero: "))

        function primo(n) {
            if (n < 2) return false
            let esPrimo = true
            for (let i = 2; i <= n / 2; i++) {
                if (n % i == 0) {
                    esPrimo = false
                    break
                }
            }
            return esPrimo
        }

        document.write(`El número ${num} ${primo(num) ? "es primo" : "no es primo"}`)
    </script>
</body>

</html>
