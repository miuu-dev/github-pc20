<body>
    <script>
        let num = parseInt(prompt("Cuántos niveles del fibonacci quieres ver? "));

        // creo 2 variables que contiene los 2 primeros niveles del FIBONACCI
        // let [f1, f2] = [0, 1] // no es un array
        // let f3

        // for (let i = 0; i < num; i++) {
        //     document.write(f1 + " ")
        //     f3 = f1 + f2
        //     f1 = f2
        //     f2 = f3
        // }
        var resultado = ""

        function fibonacci(n) {
            if (n == 1) {
                return 0

            } else if (n == 2) {
                return 1

            } else {
                return fibonacci(n - 1) + fibonacci(n - 2)
            }
        }

        for(let i = 1; i < num ; i++) {
            resultado += fibonacci(i) + " "
        }

        document.write(resultado)

    </script>
</body>
