<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bucle for ... of</title>
    <link rel="icon" href="../../img/miuuLogo.png">
    <style>
        @font-face {
            font-family: 'CenturyGothic';
            src: url('../../fonts/CenturyGothic.otf');
        }

        * {
            font-family: 'CenturyGothic', sans-serif;
        }
    </style>
</head>
<body>
    <script>
        // con for ... of nos devuelve todolos los elementos que tiene, INCLUYENDO los undefined
        let array1 = [5,6,,,9,,,8,,,9,,10]
        for(let i of array1) {
            document.write(`La posición es ${i} <br>`)
        }

        document.write("<br>")

        let array2 = "Probando los for"
        for(let i of array2) {
            document.write(`Caracter ${i} <br>`)
        }
    </script>
</body>
</html>
