<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4.4. Método indexOf, lastIndexOf e includes</title>
    <link rel="icon" href="../../img/miuuLogo.png">
    <style>
        @font-face {
            font-family: 'CenturyGothic';
            src: url('../../fonts/CenturyGothic.otf');
        }

        * {
            font-family: 'CenturyGothic', sans-serif;
        }
    </style>
</head>
<body>
    <script>
        const dias=["Lunes","Martes","Miércoles","Jueves", "Viernes","Sábado","Domingo,Lunes","Martes","Miércoles","Jueves", "Viernes","Sábado","Domingo"];
        document.write("Primera posición de Jueves: " , dias.indexOf('Jueves'))

        document.write("<br>Última posición de Jueves: ", dias.lastIndexOf("Jueves"))

        document.write("<br>¿Incluye Jueves?: ", dias.includes("Jueves"))
        document.write("<br>¿Incluye Patatas?: ", dias.includes("Patatas"))
    </script>
</body>
</html>
