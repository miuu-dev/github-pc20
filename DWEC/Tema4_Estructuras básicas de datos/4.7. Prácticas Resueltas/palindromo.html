        * {

<body>
    <script>
        let texto = prompt("Escribe un texto: ")

        // en otra variable, voy a guardar el texto del usuario y le doy a dar la vuelta, y luego los comparo
        let reversa = [...texto].reverse().join("")

        // if(texto == reversa) {
        //     alert("Es un palíndromo: " + texto)
        // } else {
        //     alert("No es un palíndromo: " + texto)
        // }

        // OPERADOR CONDICIONAL / TERNARIO
        alert((texto==reversa)?"Es un palíndromo: " + texto:"No es un palíndromo: " + texto)
    </script>
