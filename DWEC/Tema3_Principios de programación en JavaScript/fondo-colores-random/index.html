<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fondo epiléptico</title>
    <style>
        @font-face {
            font-family: "CenturyGothic";
            src: url(../fonts/CenturyGothic.otf);
        }

    /* Hacemos que html y body ocupen toda la pantalla y eliminamos márgenes */
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
        }
    </style>
</head>
<body>
    <script>
        let rojo = parseInt(Math.random()*256)
        let verde = parseInt(Math.random()*256)
        let azul = parseInt(Math.random()*256)

        document.write(`<div style="background-color: rgb(${rojo}, ${verde}, ${azul}); width: 100%; height: 100%;">  </div>`);
    </script>
</body>
</html>
