<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factorial</title>
    <style>
        @font-face {
            font-family: "CenturyGothic";
            src: url(../fonts/CenturyGothic.otf);
        }

        body {
            font-family: "CenturyGothic";
        }
    </style>
</head>
<body>
    <script>
        let number = parseInt(prompt("Introduce el número a factorizar: "));
        let originalNumber = number;
        let result = 1;

        do {
            result *= number
            number--
        } while (number > 1)

        document.write("El factorial de " + originalNumber + " es " + result)

    </script>
</body>
</html>
