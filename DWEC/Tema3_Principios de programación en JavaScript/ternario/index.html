<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>uso de isNaN y ternarios</title>
    <style>
        @font-face {
            font-family: "CenturyGothic";
            src: url(../fonts/CenturyGothic.otf);
        }

        body {
            font-family: "CenturyGothic";
        }
    </style>
</head>
<body>
    <script>
        let num = parseInt(prompt("Introduce un número: "));
        alert(isNaN(num)?"No es un número":"Es un número");
    </script>
</body>
</html>
