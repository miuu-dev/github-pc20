services:
  php-apache:
    image: php:8.2-apache
    container_name: entorno_php_dwes
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html/
    command: >
      bash -c "docker-php-ext-install pdo pdo_mysql && apache2-foreground"

  db:
    image: mysql:8.0
    container_name: mysql_dwes
    environment:
      MYSQL_ROOT_PASSWORD: itssm1uu07_@PHPmyAdmin
    ports:
      - "3306:3306"

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin_dwes
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PASSWORD: itssm1uu07_@PHPmyAdmin